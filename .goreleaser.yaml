# Release pipeline: builds the standalone and agent binaries for the platforms
# winterflow targets (x86 mini-PCs and ARM boards) and publishes them as raw
# binaries + checksums.txt on the GitHub release.
#
# Asset naming is a contract shared with two consumers — keep them in sync:
#   - scripts/install.sh (release_asset_name) downloads
#     winterflow-{os}-{arch} (standalone) from releases/latest/download
#   - the self-updater (internal/infra/orchestrator/docker_compose/
#     updater.go) downloads winterflow-{os}-{arch} (standalone) or
#     agent-{os}-{arch} (agent) for the tag it is told to update to
# The R2 mirror (make release-binaries / cdn-upload) uses its own names.
#
# CGO is off so cross-compilation works everywhere; SQLite is the pure-Go
# modernc.org/sqlite driver.
#
# Local dry run: goreleaser release --snapshot --clean
version: 2

project_name: winterflow

before:
  hooks:
    # Bundle the web UI first so go:embed ships the real SPA (not the committed
    # placeholder) inside the standalone binary.
    - pnpm --dir web install --frozen-lockfile
    - pnpm --dir web run build
    # vite empties web/dist, taking the tracked .gitkeep with it — restore it
    # or goreleaser's dirty-tree check fails the release.
    - touch web/dist/.gitkeep
    # Attribution notices for everything compiled into the binaries; published
    # as a release asset below (release.extra_files). Needs web/node_modules,
    # so it must run after the pnpm install hook. The output is gitignored,
    # so the dirty-tree check stays clean.
    - bash scripts/third_party_licenses.sh

builds:
  - id: standalone
    main: ./cmd/standalone
    binary: winterflow-standalone
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    # GOARM=6 runs on every 32-bit Raspberry Pi (Zero/1 are armv6).
    goarm:
      - "6"
    ldflags:
      - -s -w -X winterflow/pkg/version.version={{ .Version }}
  - id: agent
    main: ./cmd/agent
    binary: winterflow-agent
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "6"
    ldflags:
      - -s -w -X winterflow/pkg/version.version={{ .Version }}

archives:
  # Raw binaries, not tarballs: install.sh and the self-updater fetch them
  # directly. {{ .Arch }} is "arm" for the GOARM build, matching runtime.GOARCH
  # on the devices that download it.
  - id: standalone
    ids: [standalone]
    formats: [binary]
    name_template: "winterflow-{{ .Os }}-{{ .Arch }}"
  - id: agent
    ids: [agent]
    formats: [binary]
    name_template: "agent-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: checksums.txt

release:
  extra_files:
    # The MIT/BSD/Apache dependencies require their notices to accompany
    # binary distribution; the raw-binary assets can't carry them, so the
    # notices file sits next to them on the release page.
    - glob: THIRD_PARTY_LICENSES.txt

changelog:
  use: github
  filters:
    exclude:
      - "^docs"
      - "^test"
      - "^chore"
