openapi: 3.1.0
info:
  description: |-
    Generated from the route tables in internal/app/web by `make openapi`; do not edit.

    JSON responses use the envelope {success, message, data}. Response schemas list every field the server always writes as required; request schemas require only what the handler rejects without. Unknown properties are allowed everywhere, so new response fields are not a breaking change.

    ## Asynchronous operations and GET /api/v1/sse

    A 202 response means the command was dispatched to the server's agent; its data.request_id names the outcome, which arrives only over the event stream:

    1. Open GET /api/v1/sse BEFORE dispatching. Results are best-effort: they are not buffered or replayed, so a result produced while no stream is open, or while the client is not reading, is lost.
    2. A result is delivered only to the open streams of the user who dispatched the command (all of them, if that user has several).
    3. Each event is `data: <Notification JSON>`. Match type == "operation_result" and ref == request_id; status 1 with error means it failed, otherwise payload matches the operation's x-operation-result schema.
    4. Other event types (server_status, apps_status) interleave on the same stream, sent to every member of the server's organization; ignore types you do not handle.
  title: Winterflow API
  version: "1"
paths:
  /_/health:
    get:
      operationId: health
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    type: "null"
                  message:
                    type: string
                  success:
                    const: true
                    type: boolean
                required:
                - success
                - data
                type: object
          description: OK
      summary: Liveness probe
      tags:
