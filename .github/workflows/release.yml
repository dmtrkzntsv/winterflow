# Publishes a GitHub release with prebuilt binaries for every push to main
# that passed CI: it runs when the `ci` workflow (ci.yml) completes
# successfully for a push to main, and releases exactly the commit CI tested.
# Versions are calver: vYYMMDD.{build} (UTC date, build number counting up
# from 1 within the day) — computed and tagged here automatically.
# Asset naming and platforms live in .goreleaser.yaml.
name: release

on:
  workflow_run:
    workflows:
      - ci
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# One release at a time: parallel runs would compute the same next build
# number and race on the tag push.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  goreleaser:
    # Only a green CI run of a push to main releases. The event check matters:
    # a pull request whose head branch is also named "main" (e.g. from a
    # fork) completes ci with head_branch == main too; the repository check
    # rejects runs from forks outright. A manual dispatch must target main.
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI tested (workflow_run runs on the default branch's
          # latest commit otherwise); a manual dispatch uses the chosen ref.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # All history and tags: needed to count today's builds and for the
          # changelog between releases.
          fetch-depth: 0

      # Skip commits that are already released. CI runs for several pushes
      # can finish out of order, or be re-run; this workflow then sees a
      # commit that carries a release tag itself (duplicate) or that an
      # already-released newer commit contains (out of order). Releasing it
      # would publish a stale build under a newer version number.
      - name: Check whether this commit is already released
        id: released
        run: |
          if [ -n "$(git tag --contains HEAD -l 'v*')" ]; then
            echo "HEAD is already covered by a release tag; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # The pnpm version comes from "packageManager" in web/package.json.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Tag calver release
        id: tag
        if: steps.released.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          today="$(date -u +%y%m%d)"
          last="$(git tag -l "v${today}.*" | sed "s/^v${today}\.//" | sort -n | tail -1)"
          tag="v${today}.$(( ${last:-0} + 1 ))"
          echo "Releasing ${tag}"
          git tag "$tag"
          git push origin "$tag"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - uses: goreleaser/goreleaser-action@v6
        if: steps.released.outputs.skip != 'true'
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Mirror every binary (standalone, agent, api, hub) to the shared R2
      # bucket under winterflow/<tag>/ and winterflow/latest/ (see the
      # release-binaries and cdn-upload Makefile targets). The R2_* secrets are
      # added by the repository owner; without them the mirror is skipped.
      - name: Mirror binaries to R2
        if: steps.released.outputs.skip != 'true'
        env:
          WINTERFLOW_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          WINTERFLOW_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          WINTERFLOW_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [ -z "$WINTERFLOW_R2_ENDPOINT" ]; then
            echo "::warning::R2_ENDPOINT secret is empty; skipping the R2 mirror"
            exit 0
          fi
          make release-binaries VERSION="${TAG#v}"
          make cdn-upload CHANNEL="$TAG"
          make cdn-upload CHANNEL=latest
