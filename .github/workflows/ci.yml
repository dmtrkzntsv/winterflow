# CI for every pull request and every push to main: gofmt, vet, race-enabled
# Go tests, web lint/tests/build, the installer's dry-run suite, and the
# coverage gates (tools/diffcov). release.yml waits for this workflow's
# success on main before it publishes anything.
name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # PRs: a newer push to the branch cancels the run in progress. main: one
  # group per commit, so every push finishes and can trigger its release.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt -w these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # Includes the API contract suite on SQLite. -coverpkg=./... so that
      # test-only package counts toward the handlers, usecases and
      # repositories it drives; WF_CONTRACT_GUARD=require turns a stray
      # -run/-skip/-short, which would skip its route-coverage guard, into a
      # failure.
      - name: go test
        env:
          WF_CONTRACT_GUARD: require
        run: go test -race -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...

      - uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from "packageManager" in web/package.json.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm --dir web install --frozen-lockfile

      - name: Lint
        run: pnpm --dir web run lint

      - name: Test
        run: pnpm --dir web run test:coverage

      - name: Build
        run: pnpm --dir web run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: web/coverage/lcov.info
          if-no-files-found: error

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install.sh dry-run suite
        run: bash scripts/install_test.sh

  # Generated sqlc code (internal/infra/db/sqlc/gen) must match the queries
  # and migrations it is built from.
  sqlc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: make sqlc-check
        run: make sqlc-check

  # The API contract suite and the internal/infra/db packages (migration
  # runner, repositories) on Postgres (the go job already runs them on
  # SQLite). The contract suite must match testdata/parity.golden.json like
  # the SQLite run, and this job's coverage profile is merged into the
  # gates: Postgres-only branches run nowhere else.
  contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      WF_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      WF_CONTRACT_GUARD: require
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Contract suite and DB packages (Postgres)
        run: >-
          go test -race -count=1 -covermode=atomic -coverpkg=./...
          -coverprofile=contract-postgres.out ./internal/app/web/contract/ ./internal/infra/db/...

      - uses: actions/upload-artifact@v4
        with:
          name: contract-postgres-coverage
          path: contract-postgres.out
          if-no-files-found: error

  coverage:
    needs: [go, web, contract]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The diff gate runs `git diff <base>...HEAD`, which needs the
          # base commit in the clone.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@v4
        with:
          name: go-coverage

      - uses: actions/download-artifact@v4
        with:
          name: web-coverage
          path: web/coverage

      - uses: actions/download-artifact@v4
        with:
          name: contract-postgres-coverage

      # Duplicate blocks are fine: diffcov keeps the highest count per block.
      - name: Merge Postgres contract coverage
        run: tail -n +2 contract-postgres.out >> coverage.out

      - name: Diff coverage (changed lines >= 80%)
        if: github.event_name == 'pull_request'
        # HEAD is the PR's merge ref (base tip + PR head), so its first parent
        # is the base branch as it is now. github.event.pull_request.base.sha
        # is the base at the time the PR was opened/retargeted and goes stale
        # (stacked PRs, "Update branch"), which would count other PRs' lines.
        run: |
          if ! git rev-parse -q --verify 'HEAD^2' >/dev/null; then
            echo "::error::HEAD is not a pull request merge ref; cannot find the base commit"
            exit 2
          fi
          BASE_SHA="$(git rev-parse 'HEAD^1')"
          go run ./tools/diffcov --base "$BASE_SHA" --min 80 --github \
            --go coverage.out --lcov web/coverage/lcov.info

      - name: Coverage ratchet (totals vs coverage-baseline.json)
        if: ${{ !cancelled() }}
        run: >-
          go run ./tools/diffcov ratchet --baseline coverage-baseline.json
          --go coverage.out --lcov web/coverage/lcov.info
