# Cuts a release of main's tip when dispatched by hand:
# `gh workflow run release.yml --ref main [-f version=v1.2.0]`. Pushing to main publishes no
# release, only the R2 `edge` channel (edge.yml); check that CI is green on
# the commit before releasing it. It publishes a GitHub release with prebuilt
# binaries and the ship version + `latest` channel on R2.
# Versions are semver tags vMAJOR.MINOR.PATCH. The `version` input picks
# one (it must be above the latest release); left empty, the patch of the
# latest vX.Y.Z tag is bumped (v0.1.0 when there is none yet).
# Asset naming and platforms live in .goreleaser.yaml.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (vX.Y.Z); empty bumps the latest release's patch"
        required: false
        default: ""

permissions:
  contents: write

# One release at a time: parallel runs would compute the same next version
# and race on the tag push.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  goreleaser:
    # A dispatch must target main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # dispatch edge.yml
    steps:
      - uses: actions/checkout@v4
        with:
          # All history and tags: needed to count today's builds and for the
          # changelog between releases.
          fetch-depth: 0

      # Skip a commit that is already released: dispatching twice must not
      # tag the same build again under a newer version number. Only semver
      # tags count (vX.Y.Z; the glob needs two dots).
      # The tag is pushed before the R2 publish below, so a release whose
      # publish failed is skipped on a re-dispatch too. Recover it from a
      # checkout of the tag with ship's R&W credentials:
      #   make ship-dist VERSION=<tag> && make ship-publish VERSION=<tag> CHANNELS=latest
      # (ship replaces a version folder a failed publish left without
      # SHA256SUMS).
      - name: Check whether this commit is already released
        id: released
        run: |
          if [ -n "$(git tag --contains HEAD -l 'v*.*.*')" ]; then
            echo "HEAD is already covered by a release tag; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # The pnpm version comes from "packageManager" in web/package.json.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Tag release
        id: tag
        if: steps.released.outputs.skip != 'true'
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="$(bash scripts/next_version.sh "$REQUESTED")"
          echo "Releasing ${tag}"
          git tag "$tag"
          git push origin "$tag"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - uses: goreleaser/goreleaser-action@v6
        if: steps.released.outputs.skip != 'true'
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish every binary (standalone, agent, api, hub) with its systemd
      # unit template and env example to R2 with ship, as version <tag> and
      # the latest channel (the ship-dist and ship-publish Makefile targets);
      # hosts install them with `ship install`. ship-dist runs after
      # goreleaser, whose --clean wipes dist/ (dist/ship included). The R2_*
      # secrets (a Read & Write token on the ship bucket) are added by the
      # repository owner; without them the publish is skipped.
      - uses: dmtrkzntsv/ship@v0
        if: steps.released.outputs.skip != 'true'

      - name: Publish to R2 with ship
        if: steps.released.outputs.skip != 'true'
        env:
          SHIP_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          SHIP_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          SHIP_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [ -z "$SHIP_R2_ENDPOINT" ]; then
            echo "::warning::R2_ENDPOINT secret is empty; skipping the R2 publish"
            exit 0
          fi
          make ship-dist VERSION="$TAG"
          make ship-publish VERSION="$TAG" CHANNELS=latest

      # The edge channel was built before this tag existed, so it reports the
      # previous release plus a commit count. Rebuild it from main's head,
      # which now describes itself from the new tag. Last, and its failure
      # takes nothing back: the next push to main moves edge anyway.
      - name: Rebuild edge
        if: steps.released.outputs.skip != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run edge.yml --repo "$GITHUB_REPOSITORY" --ref main
