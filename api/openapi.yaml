        name: sess
        schema:
          enum:
          - "0"
          - "1"
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FormDataLoginForm'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionUser'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryError'
            text/plain:
              schema:
                type: string
          description: Bad Request
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryError'
            text/plain:
              schema:
                type: string
          description: Forbidden
        "429":
          content:
            text/plain:
              schema:
                type: string
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryError'
            text/plain:
              schema:
                type: string
          description: Internal Server Error
      summary: Email+password login; sets the JWT cookie
      tags:
      - auth
  /auth/logout:
    get:
      operationId: authLogout
      responses:
        "200":
          description: OK
        "429":
          content:
            text/plain:
              schema:
                type: string
          description: Too Many Requests
      summary: Clear the JWT cookie
      tags:
      - auth
  /auth/status:
    get:
      operationId: authStatus
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatus'
          description: OK
        "429":
          content:
            text/plain:
              schema:
                type: string
          description: Too Many Requests
      summary: Whether the request carries a valid session
      tags:
      - auth
  /auth/user:
    get:
      operationId: authUser
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionUser'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryError'
            text/plain:
              schema:
                type: string
          description: Unauthorized
        "429":
          content:
            text/plain:
              schema:
                type: string
          description: Too Many Requests
      summary: The session's user record
      tags:
      - auth
  /avatar/{avatar}:
    get:
      operationId: avatar
      parameters:
      - in: path
        name: avatar
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            image/*:
              schema:
                type: string
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryError'
            text/plain:
              schema:
                type: string
          description: Bad Request
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryError'
            text/plain:
              schema:
                type: string
          description: Forbidden
      summary: A stored avatar image
      tags:
      - auth
